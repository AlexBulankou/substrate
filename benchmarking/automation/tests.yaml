# Each test runs `runner.py -f <file> -t <duration> -u <users> --name <name>`
# with --tag set to the build commit hash and --dest set from the orchestrator's
# --dest flag. The orchestrator deploys + tears down substrate + workloads
# around each test so runs don't pollute each other.
#
# Optional `flags` is a list of arbitrary strings appended to runner.py's
# argv; runner.py forwards them to locust verbatim.
#
# Optional `workerCount` (default 1) sets the WorkerPool replica count for
# the deploy that runs before this test. The orchestrator redeploys
# workloads between tests, so each test can pick its own scale.
#
# Optional `sandboxClass` (default "gvisor") picks the sandbox runtime for
# the benchmark WorkerPool. Allowed values: "gvisor" | "microvm".
#
# Required `targetCluster` names a config file under
# /etc/orchestrator/target-clusters/ (e.g. `targetCluster: dev` ->
# /etc/orchestrator/target-clusters/dev.sh). The orchestrator copies that
# file into the cloned repo as .ate-dev-env.sh before the test runs and
# deletes it after, so different tests can target different clusters /
# projects from one CronJob run.

tests:
  - name: glutton_baseline_1_user
    description: "Glutton baseline: 1 concurrent user for 1 minute"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 1
    workerCount: 1
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_baseline_5_users
    description: "Glutton baseline: 5 concurrent users for 1 minute"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 5
    workerCount: 5
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_baseline_10_users
    description: "Glutton baseline: 10 concurrent users for 1 minute (doubles the number of workers/node)"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 10
    workerCount: 10
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_oversubscribe_15_users
    description: "Glutton baseline: 15 concurrent users for 2 minutes (50% oversubscribed)"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 2m
    users: 15
    workerCount: 10
    flags:
      - "--min-wait-time"
      - "0.5"
      - "--max-wait-time"
      - "1.0"

  # --- substrate SLO-ladder × sandboxClass (#6595) ---------------------------
  # Ascending-user ladders at a fixed tag; automation/slo_knee.py reads the
  # per-run stats.jsonl and reports the SLO-knee (max users whose target-op p95
  # met the SLO) + its throughput. Two axes cross here: LOAD (the user rungs)
  # and ISOLATION (sandboxClass gvisor vs microvm), so the same knee can be
  # compared across runtimes. runner.py stamps each run's `users` into the
  # JSONL, so the post-processor keys rungs explicitly (no name-parse needed).
  #
  # `targetCluster: dev` names the existing orchestrator config; the live
  # substrate ladder fire repoints these to the throwaway benchmark cluster's
  # target-cluster config (that spend-gated, collision-ack-gated run is a
  # separate step from these reference entries).

  # Cold-start / TTFE ladder — gVisor. Each user provisions a fresh actor,
  # measures create->resume-from-golden->first-read once, then StopUser()s, so
  # a rung is N-concurrent cold activations. Gate the `ttfe/ColdStart`
  # composite (slo_knee.py --op ColdStart --slo 5s).
  - name: coldstart_ladder_1_user_gvisor
    description: "Cold-start TTFE: 1 concurrent fresh-actor activation (gVisor)"
    targetCluster: dev
    file: /app/tests/ate_coldstart.py
    duration: 2m
    users: 1
    workerCount: 1
    sandboxClass: gvisor
  - name: coldstart_ladder_5_users_gvisor
    description: "Cold-start TTFE: 5 concurrent fresh-actor activations (gVisor)"
    targetCluster: dev
    file: /app/tests/ate_coldstart.py
    duration: 2m
    users: 5
    workerCount: 5
    sandboxClass: gvisor
  - name: coldstart_ladder_10_users_gvisor
    description: "Cold-start TTFE: 10 concurrent fresh-actor activations (gVisor)"
    targetCluster: dev
    file: /app/tests/ate_coldstart.py
    duration: 2m
    users: 10
    workerCount: 10
    sandboxClass: gvisor
  - name: coldstart_ladder_20_users_gvisor
    description: "Cold-start TTFE: 20 concurrent fresh-actor activations (gVisor)"
    targetCluster: dev
    file: /app/tests/ate_coldstart.py
    duration: 2m
    users: 20
    workerCount: 10
    sandboxClass: gvisor

  # Cold-start / TTFE ladder — microVM. Same rungs, microvm isolation; the
  # orchestrator runs install-microvm-deps between substrate + workload deploy.
  - name: coldstart_ladder_1_user_microvm
    description: "Cold-start TTFE: 1 concurrent fresh-actor activation (microVM)"
    targetCluster: dev
    file: /app/tests/ate_coldstart.py
    duration: 2m
    users: 1
    workerCount: 1
    sandboxClass: microvm
  - name: coldstart_ladder_5_users_microvm
    description: "Cold-start TTFE: 5 concurrent fresh-actor activations (microVM)"
    targetCluster: dev
    file: /app/tests/ate_coldstart.py
    duration: 2m
    users: 5
    workerCount: 5
    sandboxClass: microvm
  - name: coldstart_ladder_10_users_microvm
    description: "Cold-start TTFE: 10 concurrent fresh-actor activations (microVM)"
    targetCluster: dev
    file: /app/tests/ate_coldstart.py
    duration: 2m
    users: 10
    workerCount: 10
    sandboxClass: microvm
  - name: coldstart_ladder_20_users_microvm
    description: "Cold-start TTFE: 20 concurrent fresh-actor activations (microVM)"
    targetCluster: dev
    file: /app/tests/ate_coldstart.py
    duration: 2m
    users: 20
    workerCount: 10
    sandboxClass: microvm

  # Warm steady-state ResumeActor ladder — gVisor. The warm user holds one
  # actor and loops Get/Resume/Suspend, so this ladder finds the sustainable
  # steady-state ResumeActor knee (slo_knee.py --op ResumeActor --slo 1s),
  # the counterpart to the cold-start knee above.
  - name: warm_resume_ladder_1_user_gvisor
    description: "Warm ResumeActor: 1 concurrent user, steady-state (gVisor)"
    targetCluster: dev
    file: /app/tests/ate_api.py
    duration: 1m
    users: 1
    workerCount: 1
    sandboxClass: gvisor
  - name: warm_resume_ladder_5_users_gvisor
    description: "Warm ResumeActor: 5 concurrent users, steady-state (gVisor)"
    targetCluster: dev
    file: /app/tests/ate_api.py
    duration: 1m
    users: 5
    workerCount: 5
    sandboxClass: gvisor
  - name: warm_resume_ladder_10_users_gvisor
    description: "Warm ResumeActor: 10 concurrent users, steady-state (gVisor)"
    targetCluster: dev
    file: /app/tests/ate_api.py
    duration: 1m
    users: 10
    workerCount: 10
    sandboxClass: gvisor
  - name: warm_resume_ladder_20_users_gvisor
    description: "Warm ResumeActor: 20 concurrent users, steady-state (gVisor)"
    targetCluster: dev
    file: /app/tests/ate_api.py
    duration: 2m
    users: 20
    workerCount: 10
    sandboxClass: gvisor
